[project]
name = "pasok-siaga-api"
version = "0.1.0"
description = "API simulasi ketahanan rantai pasok Pasok-Siaga"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165,<1",
    "ortools>=9.14,<10",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
